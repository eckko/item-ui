# Builds the encrypted book (reader + quiz) of this private book repo and
# uploads it to the private R2 bucket behind the one-ui Worker. Copy it to
# .github/workflows/publish-r2.yml in the book repo and set the env values.
#
# The plain book never leaves this repo. The job encrypts everything with the
# library key inside the runner and uploads ciphertext only; nothing is
# committed back, and the log shows counts only (no title, name or key).
# The build tools and publish_r2.py come from eckko/item-ui at TEMPLATE_TAG.
#
# One-time setup in this repo:
#   .onebook.json   commit {"id": "<32 hex>"}. Run publish_r2.py once on
#                   your computer (it makes the file when it is missing),
#                   then commit it. The id never changes. CI refuses to
#                   run without it (a new id every run would publish the
#                   book again and again).
# Settings > Secrets and variables > Actions, secrets:
#   LIBRARY_KEY          32 bytes as 64 hex characters or base64
#   R2_ACCOUNT_ID        Cloudflare account id
#   R2_ACCESS_KEY_ID     R2 token, Object Read and Write on the bucket
#   R2_SECRET_ACCESS_KEY the matching secret
#   R2_BUCKET            books
#   WORKER_URL           https://one-ui-index.<subdomain>.workers.dev
name: Publish book to R2

on:
  push:
    branches: [main]
    paths:
      - references/**
      - questions.json
      - media/**
      - book-structure/**
      - .onebook.json
      - .github/workflows/publish-r2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-r2
  cancel-in-progress: false

env:
  # Leave empty for a quiz-only book (no reader).
  BOOK_EPUB: references/YOUR_BOOK.epub
  NOTES_EPUB: ""            # for example references/my-notes.epub
  # Subject tags shown on the home page, separated by commas.
  TAGS: ""
  AUTHOR: ""                # empty = the "author" of questions.json
  # An exact tag of eckko/item-ui that contains tools/site/publish_r2.py:
  # no "v", never a branch.
  TEMPLATE_TAG: 3.2.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check the setup
        id: setup
        env:
          KEY: ${{ secrets.LIBRARY_KEY }}
          ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          ACCESS: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [[ "$BOOK_EPUB" == *YOUR_* ]]; then
            echo "::notice::BOOK_EPUB is not set; nothing published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEY" ] || [ -z "$ACCOUNT" ] || [ -z "$ACCESS" ] \
               || [ -z "$SECRET" ] || [ -z "$BUCKET" ]; then
            echo "::error::A secret is missing (LIBRARY_KEY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY or R2_BUCKET)."
            exit 1
          elif ! [[ "$TEMPLATE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::TEMPLATE_TAG must be an exact tag like 3.2.0."
            exit 1
          fi

      - name: Check out this book repo
        if: steps.setup.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          path: book

      - name: Check out the tools (template at its tag)
        if: steps.setup.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: eckko/item-ui
          ref: ${{ env.TEMPLATE_TAG }}
          path: template

      - name: Set up Python
        if: steps.setup.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the packages
        if: steps.setup.outputs.skip != 'true'
        run: pip install beautifulsoup4 lxml cryptography boto3 pillow

      - name: Build the encrypted book
        if: steps.setup.outputs.skip != 'true'
        env:
          SUBJECT_KEY: ${{ secrets.LIBRARY_KEY }}
        run: |
          echo "::add-mask::$SUBJECT_KEY"
          args=(--book book --template-tag "$TEMPLATE_TAG" --out "$RUNNER_TEMP/built")
          if [ -n "$BOOK_EPUB" ]; then args+=(--epub "$BOOK_EPUB"); fi
          if [ -n "$NOTES_EPUB" ]; then args+=(--notes-epub "$NOTES_EPUB"); fi
          python3 template/tools/book_build/build_book.py "${args[@]}"

      - name: Upload to R2
        if: steps.setup.outputs.skip != 'true'
        env:
          LIBRARY_KEY: ${{ secrets.LIBRARY_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          echo "::add-mask::$LIBRARY_KEY"
          args=(--built "$RUNNER_TEMP/built" --book book --require-id)
          if [ -n "$AUTHOR" ]; then args+=(--author "$AUTHOR"); fi
          IFS=',' read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done
          python3 template/tools/site/publish_r2.py "${args[@]}"
